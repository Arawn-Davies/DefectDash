<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 320" width="1500" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3340"/>
      <stop offset="1" stop-color="#151820"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5F"/>
      <stop offset="1" stop-color="#C9242B"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="560" cy="560" rx="236" ry="226"/>
    </clipPath>
  </defs>

  <!-- icon, scaled to 280 px -->
  <g transform="translate(20 20) scale(0.2734375)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
    <g stroke-linecap="round" fill="none">
      <path d="M150 470 H300" stroke="url(#dash)" stroke-width="34"/>
      <path d="M190 560 H290" stroke="url(#dash)" stroke-width="34"/>
      <path d="M150 650 H300" stroke="url(#dash)" stroke-width="34"/>
    </g>
    <g stroke="#1B1D24" stroke-width="22" stroke-linecap="round" fill="none">
      <path d="M500 352 C470 300 440 285 410 290"/>
      <path d="M620 352 C650 300 680 285 710 290"/>
    </g>
    <circle cx="404" cy="288" r="18" fill="#1B1D24"/>
    <circle cx="716" cy="288" r="18" fill="#1B1D24"/>
    <circle cx="560" cy="398" r="118" fill="#1B1D24"/>
    <circle cx="518" cy="378" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="602" cy="378" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
    <ellipse cx="560" cy="560" rx="236" ry="226" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="548" y="330" width="24" height="470" fill="#1B1D24"/>
      <circle cx="470" cy="470" r="34" fill="#1B1D24"/>
      <circle cx="650" cy="470" r="34" fill="#1B1D24"/>
      <circle cx="430" cy="590" r="30" fill="#1B1D24"/>
      <circle cx="690" cy="590" r="30" fill="#1B1D24"/>
      <circle cx="500" cy="690" r="26" fill="#1B1D24"/>
      <circle cx="620" cy="690" r="26" fill="#1B1D24"/>
      <ellipse cx="470" cy="420" rx="120" ry="60" fill="#FFFFFF" fill-opacity="0.12" transform="rotate(-25 470 420)"/>
    </g>
    <path d="M352 490 A236 226 0 0 1 768 490" fill="none" stroke="#1B1D24" stroke-width="18"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="196" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="140" font-weight="700" letter-spacing="-3" fill="#1B1D24">
    Defect<tspan fill="#E0333A">Dash</tspan>
  </text>
  <text x="336" y="256" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="500" letter-spacing="2" fill="#6B7080">
    ASANA DEFECTS × LOCAL WORKTREES, RANKED
  </text>
</svg>
